<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talk | House of Mercy</title><link rel="stylesheet" href="styles.css"></head><body data-page="talk"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>House of Mercy</span></a><span class="top-note">Talk it through</span></header><nav id="tabs" class="nav"></nav><main class="shell narrow"><section class="card talk-shell"><div class="eyebrow">TALK</div><h1>Tell me what's going on.</h1><p class="muted">You don't need to know what kind of post it is yet. Give me the situation and I'll help you think through the story.</p><div id="chat" class="chat"></div><div class="prompt-row"><button class="chip" data-prompt="I have footage from church but I don't know what the story should be.">I have footage</button><button class="chip" data-prompt="Give me a content idea for House of Mercy this week.">Give me an idea</button><button class="chip" data-prompt="I made a Reel idea. Tell me honestly if it works.">Review my idea</button><button class="chip" data-prompt="Help me choose a Gospel song for a church Reel.">Find a song</button></div><form id="talk-form" class="composer"><textarea id="message" rows="3" placeholder="Tell me what is happening..."></textarea><div class="composer-bottom"><span class="muted small">No media needs to be stored here.</span><button class="button primary" type="submit">Send</button></div></form></section></main><script src="gate.js"></script><script src="app.js"></script></body></html>
